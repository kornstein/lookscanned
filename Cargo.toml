[package]
name = "lookscanned"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "A Typst package to make documents look scanned, photocopied, faxed or typewritten, powered by WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
wasm-minimal-protocol = "0.2"
minicbor = { version = "2.3", features = ["alloc", "half"] }
miniz_oxide = "0.9"
